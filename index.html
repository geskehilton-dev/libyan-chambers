<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منظومة توليد باركود الشهادات الرقمية</title>

<!-- ✅ استدعاء مكتبة QR الحقيقية والمضمونة أونلاين لمنع أي مشكلة في التوليد -->
<script src="https://cloudflare.com"></script>

<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f8fafc;font-family:sans-serif;color:#1a202c;padding:20px 10px;display:flex;justify-content:center;align-items:center;min-height:100vh}
  .wrap{width:100%;max-width:440px;margin:0 auto}
  .control-panel{background:#fff;border-radius:24px;padding:25px 20px;box-shadow:0 10px 30px rgba(0,0,0,0.04);border:1px solid #edf2f7}
  .control-panel h3{margin:0 0 18px;color:#0f172a;font-size:18px;text-align:center;font-weight:800}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  label{font-weight:700;font-size:13px;color:#475569}
  input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;outline:none;background:#f8fafc}
  .gen-btn{width:100%;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;background:#2b6cb0;color:white;margin-top:10px}
  .print-qr-zone{margin-top:24px;text-align:center;background:#fff;padding:20px;border:1px solid #e2e8f0;border-radius:16px}
  #qrcode-box{display:flex;justify-content:center;margin:10px auto}
  #qrcode-box img, #qrcode-box canvas { display: block; margin: 0 auto; }
</style>
</head>
<body>

<div class="wrap">
  <div class="control-panel">
    <h3>منظومة تخليق باركود الشهادات</h3>
    
    <div class="field">
      <label>نوع الشهادة:</label>
      <input id="input-type" value="شهادة منشأ التبادل الحر">
    </div>
    
    <div class="field">
      <label>رقم الشهادة:</label>
      <input id="input-number" value="MA014-M05-2131">
    </div>
    
    <div class="field">
      <label>حالة الطلب:</label>
      <select id="input-status">
        <option value="مدفوع">مدفوع</option>
        <option value="قيد الانتظار">قيد الانتظار</option>
        <option value="مرفوض">مرفوض</option>
      </select>
    </div>
    
    <div class="field">
      <label>المكتب المصدر:</label>
      <input id="input-office" value="المنطقة الغربية - مكتب رقدالين">
    </div>
    
    <button class="gen-btn" onclick="generateQR()">تخليق وتوليد الباركود أونلاين 🌐</button>
    
    <div class="print-qr-zone" id="qr-zone" style="display:none">
      <div style="font-size:13px;color:#64748b;margin-bottom:12px;font-weight:500">👇 تم توليد الكود المربوط بموقعك بنجاح للطباعة:</div>
      <div id="qrcode-box"></div>
    </div>
  </div>
</div>

<script>
function generateQR() {
  const type = encodeURIComponent(document.getElementById('input-type').value);
  const num = encodeURIComponent(document.getElementById('input-number').value.trim());
  const stat = encodeURIComponent(document.getElementById('input-status').value);
  const office = encodeURIComponent(document.getElementById('input-office').value.trim());
  
  const currentURL = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
  const fullOnlineURL = `${currentURL}/verify.html?type=${type}&num=${num}&stat=${stat}&office=${office}`;
  
  const box = document.getElementById("qrcode-box");
  box.innerHTML = "";
  
  // ✅ توليد الكود الفعلي باستخدام محرك الكود الرسمي المضمون والآمن لموقعك
  new QRCode(box, {
    text: fullOnlineURL,
    width: 200,
    height: 200,
    colorDark : "#0f172a",
    colorLight : "#ffffff",
    correctLevel : QRCode.CorrectLevel.H
  });
  
  document.getElementById('qr-zone').style.display = 'block';
}
</script>
</body>
</html>
